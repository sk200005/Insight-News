name: Automated 6-Hour News Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  API_BASE: https://insight-news-eight.vercel.app/api
  CURL_TIMEOUT: 300

jobs:
  reload-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Health Check
        run: |
          curl -f -s --max-time 30 -o /dev/null \
            "$API_BASE/health"

      - name: Step 1 - Fetch New Articles (RSS)
        id: fetch
        run: |
          RESPONSE=$(curl -f -s --max-time $CURL_TIMEOUT \
            "$API_BASE/news/reload-news")

          ARTICLE_IDS=$(echo "$RESPONSE" | jq -c '.articles | map(._id)')
          echo "Fetched IDs: $ARTICLE_IDS"

          if [ "$ARTICLE_IDS" = "[]" ] || [ "$ARTICLE_IDS" = "null" ]; then
            echo "No new articles to process."
            echo "PIPELINE_CONTINUE=false" >> $GITHUB_ENV
          else
            echo "PIPELINE_CONTINUE=true" >> $GITHUB_ENV
            echo "ARTICLE_IDS=$ARTICLE_IDS" >> $GITHUB_ENV
          fi

      - name: Step 2 - Scrape Articles
        if: env.PIPELINE_CONTINUE == 'true'
        run: |
          set +e
          RESPONSE=$(curl -f -s --max-time $CURL_TIMEOUT -X POST \
            "$API_BASE/scraper/run" \
            -H "Content-Type: application/json" \
            -d "{\"articleIds\": $ARTICLE_IDS}")
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -ne 0 ]; then
            echo "::warning::Scraping failed — skipping remaining steps"
            echo "PIPELINE_CONTINUE=false" >> $GITHUB_ENV
          else
            SCRAPED_IDS=$(echo "$RESPONSE" | jq -c '.articleIds')
            echo "Scraped IDs: $SCRAPED_IDS"

            if [ "$SCRAPED_IDS" = "null" ] || [ "$SCRAPED_IDS" = "[]" ]; then
              echo "::warning::No articles scraped — skipping remaining steps"
              echo "PIPELINE_CONTINUE=false" >> $GITHUB_ENV
            else
              echo "ARTICLE_IDS=$SCRAPED_IDS" >> $GITHUB_ENV
            fi
          fi

      - name: Step 3 - Summarize Articles
        if: env.PIPELINE_CONTINUE == 'true'
        run: |
          set +e
          RESPONSE=$(curl -f -s --max-time $CURL_TIMEOUT -X POST \
            "$API_BASE/summarize" \
            -H "Content-Type: application/json" \
            -d "{\"articleIds\": $ARTICLE_IDS}")
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -ne 0 ]; then
            echo "::warning::Summarization failed — skipping bias analysis"
            echo "PIPELINE_CONTINUE=false" >> $GITHUB_ENV
          else
            SUMMARIZED_IDS=$(echo "$RESPONSE" | jq -c '.articleIds')
            echo "Summarized IDs: $SUMMARIZED_IDS"

            if [ "$SUMMARIZED_IDS" = "null" ] || [ "$SUMMARIZED_IDS" = "[]" ]; then
              echo "::warning::No articles summarized — skipping bias"
              echo "PIPELINE_CONTINUE=false" >> $GITHUB_ENV
            else
              echo "ARTICLE_IDS=$SUMMARIZED_IDS" >> $GITHUB_ENV
            fi
          fi

      - name: Step 4 - Run Bias Analysis
        if: env.PIPELINE_CONTINUE == 'true'
        run: |
          RESPONSE=$(curl -f -s --max-time $CURL_TIMEOUT -X POST \
            "$API_BASE/bias/run" \
            -H "Content-Type: application/json" \
            -d "{\"articleIds\": $ARTICLE_IDS}")

          echo "Bias Response: $RESPONSE"
          echo "Pipeline completed successfully!"
