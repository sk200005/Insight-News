
name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy using AWS Systems Manager
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Send deployment command
        id: send
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/ssm-parameters.json <<'JSON'
          {
            "commands": [
              "sudo -iu ec2-user bash -lc 'set -e; cd /home/ec2-user/Insight-News; git pull --ff-only origin main; cd backend; npm ci --omit=dev; pm2 restart backend --update-env; pm2 save'"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-04fbbf869183df9b4" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-parameters.json \
            --comment "GitHub Actions backend deployment" \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command submitted: $COMMAND_ID"

      - name: Wait for deployment
        shell: bash
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -euo pipefail

          INSTANCE_ID="i-04fbbf869183df9b4"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '[StandardOutputContent,StandardErrorContent]' \
                  --output text || true
                exit 1
                ;;
              *)
                echo "Attempt $attempt: status=${STATUS:-Pending}"
                sleep 5
                ;;
            esac
          done

          echo "Timed out waiting for the deployment command."
          exit 1
